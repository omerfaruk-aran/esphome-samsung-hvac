# Build-only fixture. Do not upload to equipment; pins are not wiring guidance.
esphome:
  name: samsung-foundation-arduino
esp32:
  board: esp32dev
  framework:
    type: arduino
logger:
  baud_rate: 0
external_components:
- source:
    type: local
    path: ../../components
  components:
  - samsung_hvac
uart:
- id: hvac_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  parity: EVEN
- id: nasa_uart
  rx_pin: GPIO25
  tx_pin: GPIO26
  baud_rate: 9600
  parity: EVEN
samsung_hvac:
- id: hvac
  uart_id: hvac_uart
  protocol: non_nasa
  flow_control_pin: GPIO23
  devices:
  - id: living_room
    profile: non_nasa_ac
    address: 0
    fan_modes:
    - auto
    - low
    - medium
    - high
    - turbo
    vertical_swing: true
    horizontal_swing: true
    climate:
      id: living_room_projection
      name: Living Room Internal Climate
      internal: true
    target_temperature:
      name: Living Room Target Temperature
    indoor_eva_in_temperature:
      name: Living Room Indoor Eva In Temperature
    indoor_eva_out_temperature:
      name: Living Room Indoor Eva Out Temperature
    power_state:
      name: Living Room Power State
    operation_mode:
      name: Living Room Operation Mode
    fan_mode:
      name: Living Room Fan Mode
    vertical_swing_state:
      name: Living Room Vertical Swing State
    horizontal_swing_state:
      name: Living Room Horizontal Swing State
    room_temperature:
      name: Living Room Temperature
  - id: bedroom
    profile: non_nasa_ac
    address: 1
    power_state:
      name: Bedroom Power
- id: nasa_observer_bus
  uart_id: nasa_uart
  protocol: nasa
  flow_control_pin: GPIO27
  messages:
  - id: fsv_upper
    source_address: 2097154
    catalog: ehs_fsv_heating_upper
    sensor:
      name: FSV Heating Upper Observation
  - id: power_observation
    source_address: 2097152
    catalog: nasa_power
    binary_sensor:
      name: Power Observation
  - id: custom_long
    source_address: 2097152
    custom:
      code: 17408
      value_type: long_variable
      signed: false
      unit: ''
      scale: 1
      offset: 0
      source_role: indoor
      source_url: https://github.com/omerfaruk-aran/esphome-samsung-hvac
    sensor:
      name: Experimental Raw Long
  - id: raw_4204
    source_address: 2097152
    custom:
      code: 16900
      value_type: variable
      signed: false
      unit: ''
      scale: 1
      offset: 0
      source_role: indoor
      source_url: https://github.com/omerfaruk-aran/esphome_samsung_hvac_bus/discussions/261
    sensor:
      name: Raw 0x4204
  - id: double_precision_probe
    source_address: 2097152
    custom:
      code: 17408
      value_type: long_variable
      signed: false
      unit: ''
      scale: 1.0e-100
      offset: 4294967295.0
      source_role: indoor
      source_url: https://github.com/omerfaruk-aran/esphome-samsung-hvac
    sensor:
      name: Experimental Precision Probe
api:
  reboot_timeout: 0s
network: {}
