# Build-only fixture. Do not upload to equipment; pins are not wiring guidance.
esphome:
  name: samsung-foundation-idf
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  baud_rate: 0
external_components:
- source:
    type: local
    path: ../../components
  components:
  - samsung_hvac
uart:
  id: hvac_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  parity: EVEN
samsung_hvac:
  id: hvac
  uart_id: hvac_uart
  protocol: nasa
  flow_control_pin: GPIO23
  devices:
  - id: living_room
    profile: nasa_ac
    address: 2097152
    fan_modes:
    - auto
    - low
    - medium
    - high
    - turbo
    vertical_swing: true
    horizontal_swing: true
    climate:
      id: living_room_projection
      name: Living Room Internal Climate
      internal: true
    target_temperature:
      name: Living Room Target Temperature
    indoor_eva_in_temperature:
      name: Living Room Indoor Eva In Temperature
    indoor_eva_out_temperature:
      name: Living Room Indoor Eva Out Temperature
    power_state:
      name: Living Room Power State
    operation_mode:
      name: Living Room Operation Mode
    fan_mode:
      name: Living Room Fan Mode
    vertical_swing_state:
      name: Living Room Vertical Swing State
    horizontal_swing_state:
      name: Living Room Horizontal Swing State
    outdoor_address: 1048576
    presets:
    - none
    - sleep
    - quiet
    - fast
    - long_reach
    - eco
    - windfree
    outdoor_temperature:
      name: Living Room Outdoor Temperature
    error_code:
      name: Living Room Error Code
    humidity:
      name: Living Room Humidity
    filter_warning:
      name: Living Room Filter Warning
    defrosting:
      name: Living Room Defrosting
    silence_state:
      name: Living Room Silence State
    automatic_cleaning_state:
      name: Living Room Automatic Cleaning State
    preset_state:
      name: Living Room Preset State
  - id: bedroom
    profile: nasa_ac
    address: 2097153
    power_state:
      name: Bedroom Power
  - id: hydro
    profile: ehs
    address: 2097154
    outdoor_address: 1048576
    dhw_temperature:
      name: Hydro Dhw Temperature
    dhw_target_temperature:
      name: Hydro Dhw Target Temperature
    water_outlet_temperature:
      name: Hydro Water Outlet Temperature
    water_outlet_target_temperature:
      name: Hydro Water Outlet Target Temperature
    water_return_temperature:
      name: Hydro Water Return Temperature
    water_law_shift:
      name: Hydro Water Law Shift
    water_law_target_temperature:
      name: Hydro Water Law Target Temperature
    water_flow:
      name: Hydro Water Flow
    outdoor_temperature:
      name: Hydro Outdoor Temperature
    error_code:
      name: Hydro Error Code
    power_state:
      name: Hydro Power State
    dhw_power_state:
      name: Hydro Dhw Power State
    water_pump_state:
      name: Hydro Water Pump State
    defrosting:
      name: Hydro Defrosting
    operation_mode:
      name: Hydro Operation Mode
    dhw_mode:
      name: Hydro Dhw Mode
    zones:
    - number: 1
      power_state:
        name: Zone 1 Enabled
    - number: 2
      power_state:
        name: Zone 2 Enabled
  messages:
  - id: fsv_upper
    source_address: 2097154
    catalog: ehs_fsv_heating_upper
    sensor:
      name: FSV Heating Upper Observation
  - id: power_observation
    source_address: 2097152
    catalog: nasa_power
    binary_sensor:
      name: Power Observation
  - id: custom_long
    source_address: 2097152
    custom:
      code: 17408
      value_type: long_variable
      signed: false
      unit: ''
      scale: 1
      offset: 0
      source_role: indoor
      source_url: https://github.com/omerfaruk-aran/esphome-samsung-hvac
    sensor:
      name: Experimental Raw Long
  - id: raw_4204
    source_address: 2097152
    custom:
      code: 16900
      value_type: variable
      signed: false
      unit: ''
      scale: 1
      offset: 0
      source_role: indoor
      source_url: https://github.com/omerfaruk-aran/esphome_samsung_hvac_bus/discussions/261
    sensor:
      name: Raw 0x4204
  - id: double_precision_probe
    source_address: 2097152
    custom:
      code: 17408
      value_type: long_variable
      signed: false
      unit: ''
      scale: 1.0e-100
      offset: 4294967295.0
      source_role: indoor
      source_url: https://github.com/omerfaruk-aran/esphome-samsung-hvac
    sensor:
      name: Experimental Precision Probe
api:
  reboot_timeout: 0s
network: {}
