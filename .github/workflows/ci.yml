name: Validation
'on':
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m pip check
    - run: ruff check components tests tools
    - run: ruff format --check components tests tools
    - run: python tools/check_repository.py
    - run: python -m pytest -q
  firmware:
    name: Firmware (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: bus-esp-idf
          kind: bus
          framework: esp-idf
        - label: bus-arduino
          kind: bus
          framework: arduino
        - label: encrypted-nasa-ac
          kind: example
          example: nasa-ac
        - label: encrypted-non-nasa-ac
          kind: example
          example: non-nasa-ac
        - label: receive-capture
          kind: example
          example: capture
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m pip check
    - if: matrix.kind == 'bus'
      run: 'esphome config tests/yaml/${{ matrix.framework }}.yaml

        esphome compile tests/yaml/${{ matrix.framework }}.yaml'
    - if: matrix.kind == 'example'
      run: python tools/check_example.py "${{ matrix.example }}" --compile
